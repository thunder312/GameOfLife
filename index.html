<!DOCTYPE html>
<html lang="de" data-eulenwerk="spielerei">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conway's Game of Life</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="eulenwerk.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <h1><img src="favicon.svg" alt="" class="app-logo">Conway's Game of Life</h1>

    <div id="controls">
      <button id="btn-lang">🌐 EN</button>
      <button id="btn-info">? Regeln</button>
      <button id="btn-start">▶ Start</button>
      <button id="btn-step">⏭ Schritt</button>
      <button id="btn-clear">🗑 Leeren</button>
      <button id="btn-random">🎲 Zufall</button>
      <label>
        <span id="lbl-density">Dichte:</span>
        <input type="range" id="density" min="1" max="100" value="25">
        <span id="density-label">25%</span>
      </label>
      <label>
        <span id="lbl-speed">Geschwindigkeit:</span>
        <input type="range" id="speed" min="1" max="30" value="10">
        <span id="speed-label">10 FPS</span>
      </label>
      <label id="label-maxgen">
        <span id="lbl-maxgen">Max. Gen.:</span>
        <input type="checkbox" id="limit-enabled">
        <input type="number" id="max-gen" min="1" value="100" disabled>
      </label>
      <span id="generation">Generation: 0</span>
    </div>

    <div id="structures">
      <span id="structures-label">Strukturen:</span>
      <button id="btn-coloring">Färbung: AN</button>
      <button class="btn-structure" data-structure="blinker" style="--sc:#ff6b6b">Blinker</button>
      <button class="btn-structure" data-structure="glider"  style="--sc:#c084fc">Glider</button>
      <button class="btn-structure" data-structure="lwss"    style="--sc:#38bdf8">Spaceship</button>
      <button class="btn-structure" data-structure="pulsar"  style="--sc:#fb923c">Pulsar</button>
      <button class="btn-structure" data-structure="gun"     style="--sc:#fde047">Glider Gun</button>
    </div>

    <div id="stats">
      <span id="stats-label">Protokoll:</span>
      <span id="stat-1" style="color:#ff6b6b">Blinker: 0</span>
      <span id="stat-2" style="color:#c084fc">Glider: 0</span>
      <span id="stat-3" style="color:#38bdf8">Spaceship: 0</span>
      <span id="stat-4" style="color:#fb923c">Pulsar: 0</span>
      <button id="btn-reset-counts">↺ Reset</button>
    </div>

    <canvas id="canvas" width="800" height="600"></canvas>
    <p id="hint">Klicke auf das Gitter, um Zellen zu setzen oder zu löschen. Struktur auswählen → ins Grid klicken zum Platzieren (ESC zum Abbrechen).</p>
    <footer class="ew-footer ">
      <a class="ew-brand" href="https://daniel-ertl.de" target="_blank" rel="noopener"><svg class="ew-logo" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5 C11 12 16 13 24 13 C28 13 30 15 32 16 C34 15 36 13 40 13 C48 13 53 12 56 5"/><circle cx="22" cy="28" r="9"/><circle cx="42" cy="28" r="9"/><circle fill="currentColor" stroke="none" cx="22" cy="28" r="3.2"/><circle fill="currentColor" stroke="none" cx="42" cy="28" r="3.2"/><path d="M29.5 39 L32 42.5 L34.5 39"/><path d="M13 28 V48 C13 54 18 59 24 59 H40 C46 59 51 54 51 48 V28"/><path d="M19 40 C18.5 48 19.5 54 23 59"/><path d="M45 40 C45.5 48 44.5 54 41 59"/></svg>Ein Eulenwerk-Projekt</a>
      <button type="button" class="ew-btn ew-btn--ghost ew-btn--sm" data-ew-about>Über Game of Life</button>
    </footer>
  </div>

  <div id="modal-overlay">
    <div id="modal">
    </div>
  </div>

  <script src="game.js"></script>
  <script src="eulenwerk-about.js"></script>
  <script>EulenwerkAbout.init({
  "app": "Conway's Game of Life",
  "version": "1.0.0",
  "description": "Interaktives Game of Life im Browser mit Strukturen-Bibliothek, Färbung erkannter Muster und Protokoll – ohne Frameworks, pur in HTML5 Canvas.",
  "stack": [
    "Vanilla JS",
    "HTML5 Canvas"
  ],
  "github": "https://github.com/thunder312/GameOfLife",
  "logo": "favicon.svg"
});</script>
</body>
</html>
